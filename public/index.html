<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14111f" />
  <title>속삭임</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="phone">
    <!-- 비밀번호 화면 (서버에 APP_PASSWORD 가 있을 때만) -->
    <section id="gate" class="screen" hidden>
      <h1>속삭임</h1>
      <p class="sub">비밀번호를 입력해 주세요.</p>
      <form id="gateForm" class="text-form">
        <input id="gateInput" type="password" autocomplete="current-password" placeholder="비밀번호" />
        <button type="submit">들어가기</button>
      </form>
      <p id="gateMsg" class="warn"></p>
    </section>

    <!-- 대기 화면 -->
    <section id="lobby" class="screen" hidden>
      <h1>속삭임</h1>
      <p class="sub">이어폰을 끼고, 편하게 말을 걸어요.</p>
      <div id="personas" class="personas"></div>
      <details class="voice-box" open>
        <summary>소리 설정</summary>
        <label>배경음
          <select id="ambientSel">
            <option value="rain">빗소리</option>
            <option value="waves">파도</option>
            <option value="fire">장작불</option>
            <option value="none">없음</option>
          </select>
        </label>
        <label class="check"><input id="binaural" type="checkbox" /> 목소리가 양쪽 귀를 천천히 오가기 (이어폰 권장)</label>
      </details>
      <details class="voice-box">
        <summary>목소리 설정</summary>
        <label>목소리
          <select id="voiceSel"></select>
        </label>
        <label>말 빠르기 <input id="rate" type="range" min="0.7" max="1.3" step="0.05" /></label>
        <label>목소리 높낮이 <input id="pitch" type="range" min="0.5" max="1.6" step="0.05" /></label>
        <p id="pitchNote" class="hint" hidden>HD 음성은 높낮이 조절을 지원하지 않아요.</p>
        <div class="preview-row">
          <button id="previewBtn" type="button" class="preview">미리 듣기</button>
          <button id="compareBtn" type="button" class="preview ghost" hidden>추천 여성 목소리 이어 듣기</button>
        </div>
        <p class="hint">"고음질" 음성은 서버에 클라우드 TTS 키가 있을 때 나와요. "이 기기 음성"은 기기마다 달라요. 대화 성격(톤)은 위에서 상대를 고르면 바뀌어요.</p>
      </details>
      <button id="callBtn" class="round call" aria-label="시작하기">
        <svg viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 1 0 9.7 12.6A8 8 0 0 1 12.3 2z"/></svg>
      </button>
      <p class="note">AI 목소리와의 대화예요. 이어폰을 끼면 훨씬 좋아요.<br/>힘든 일이 있다면 <b>109</b>(자살예방상담) · <b>119</b></p>
      <p id="support" class="warn" hidden></p>
    </section>

    <!-- 대화 화면 -->
    <section id="call" class="screen" hidden>
      <div class="top">
        <div id="callName" class="name">하루</div>
        <div id="timer" class="timer">00:00</div>
      </div>
      <div class="orb-wrap">
        <div id="orb" class="orb idle"></div>
      </div>
      <div id="status" class="status">들어가는 중…</div>
      <div id="caption" class="caption"></div>

      <form id="textForm" class="text-form" hidden>
        <input id="textInput" autocomplete="off" placeholder="말 대신 글로 속삭이기" />
        <button type="submit">보내기</button>
      </form>

      <div class="controls">
        <button id="muteBtn" class="round small" aria-label="음소거">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <button id="hangBtn" class="round hang" aria-label="그만하기">
          <svg viewBox="0 0 24 24"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z" transform="translate(1.4 0)"/></svg>
        </button>
        <button id="kbdBtn" class="round small" aria-label="글로 입력">
          <svg viewBox="0 0 24 24"><path d="M20 5H4a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
        </button>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
